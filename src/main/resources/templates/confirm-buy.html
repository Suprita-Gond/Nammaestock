<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Confirm Purchase</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container" style="max-width: 500px; margin-top: 50px;">
        <div class="card">
            <div class="card-header bg-success text-white">
                <h3>Confirm Purchase</h3>
            </div>
            <div class="card-body">
                <form action="/confirm-buy" method="post">
                    <div class="mb-3">
                        <label>Stock Ticker:</label>
                        <input type="text" name="ticker" class="form-control" th:value="${ticker}" readonly>
                    </div>
                    <div class="mb-3">
                        <label>Price per share:</label>
                        <input type="text" class="form-control" th:value="'₹' + ${price}" readonly>
                        <input type="hidden" name="price" th:value="${price}">
                    </div>
                    <div class="mb-3">
                        <label>Quantity:</label>
                        <input type="text" class="form-control" th:value="${quantity}" readonly>
                        <input type="hidden" name="quantity" th:value="${quantity}">
                    </div>
                    <div class="mb-3">
                        <label>Total Amount:</label>
                        <input type="text" class="form-control" th:value="'₹' + ${totalPrice}" readonly style="font-weight: bold; font-size: 18px; color: #2e7d32;">
                    </div>
                    <button type="submit" class="btn btn-success w-100">Confirm Purchase</button>
                    <a href="/view-stocks" class="btn btn-secondary w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
