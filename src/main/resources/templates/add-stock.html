<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Stock - NammaStocks Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f5f5f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .container { max-width: 600px; margin-top: 50px; }
        .card { border-radius: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .card-header { background-color: #2e7d32; color: white; border-radius: 15px 15px 0 0 !important; }
        .btn-success { background-color: #2e7d32; border: none; }
        .btn-success:hover { background-color: #1b5e20; }
        .required:after { content: " *"; color: red; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="card-header">
                <h3 class="mb-0"><i class="fas fa-plus-circle"></i> Add New Stock</h3>
            </div>
            <div class="card-body">
                
                <div th:if="${session.fail}" class="alert alert-danger" th:text="${session.fail}"></div>
                <div th:if="${session.pass}" class="alert alert-success" th:text="${session.pass}"></div>
                
                <form action="/add-stock" method="post">
                    <div class="mb-3">
                        <label class="form-label required">Ticker Symbol:</label>
                        <input type="text" name="ticker" class="form-control" placeholder="e.g., RELIANCE" required>
                        <small class="text-muted">Unique stock identifier (e.g., RELIANCE, TCS, INFY)</small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label required">Company Name:</label>
                        <input type="text" name="companyName" class="form-control" placeholder="e.g., Reliance Industries Ltd" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label required">Price (₹):</label>
                        <input type="number" name="price" class="form-control" placeholder="e.g., 2500" step="0.01" required>
                        <small class="text-muted">Current stock price in Indian Rupees</small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label required">Quantity Available:</label>
                        <input type="number" name="quantity" class="form-control" placeholder="e.g., 100" step="1" required>
                        <small class="text-muted">Number of shares available for trading</small>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Changes (%):</label>
                        <input type="number" name="changes" class="form-control" placeholder="e.g., 2.5 or -1.2" step="0.1">
                        <small class="text-muted">Price change percentage (positive for gain, negative for loss)</small>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-success btn-lg">
                            <i class="fas fa-save"></i> Add Stock
                        </button>
                        <a href="/manage-stocks" class="btn btn-secondary">
                            <i class="fas fa-arrow-left"></i> Back to Manage Stocks
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
